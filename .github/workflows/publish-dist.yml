name: Publish dist to website repository

on:
  # Run in the base repository so merged fork PRs can use the deploy secret.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: publish-website-dist
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          # Only build code already merged into main, never the PR head.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: mediamtx-client/mediamtx-client.github.io
          ref: main
          path: website
          # `DEPLOY_TOKEN` containing a personal access token with **Contents: read and write** permission for the destination repository.
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Sync build output
        run: |
          test -s dist/index.html
          mkdir -p website/dist
          rsync -a --delete dist/ website/dist/

      - name: Commit and push build output
        working-directory: website
        env:
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- dist
          if git diff --cached --quiet; then
            echo "Build output is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Deploy dist from ${SOURCE_SHA}"
          git push origin HEAD:main

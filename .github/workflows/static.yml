name: Build and deploy App

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build project
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify build output
        run: test -s dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          include-hidden-files: true

  deploy-pages:
    name: Update GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-dist:
    name: Publish dist to target repository
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: mediamtx-client/mediamtx-client.github.io
          ref: main
          path: website
          # DEPLOY_TOKEN needs Contents: read and write for the target repository.
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Sync build output
        run: |
          test -s dist/index.html
          mkdir -p website/dist
          rsync -a --delete dist/ website/dist/

      - name: Commit and push build output
        working-directory: website
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- dist
          if git diff --cached --quiet; then
            echo "Build output is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Deploy dist from ${SOURCE_SHA}"
          git push origin HEAD:main
